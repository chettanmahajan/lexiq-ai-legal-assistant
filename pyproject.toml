[project]
name = "lexiq"
version = "0.1.0"
description = "A legal research assistant for Indian law, built with RAG, ChromaDB, and Groq."
authors = [{ name = "Chetan Mahajan", email = "chettanmahajan@gmail.com" }]
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "streamlit==1.56.0",
    "python-dotenv==1.2.2",
    "groq==0.37.1",
    "langchain-core==1.3.3",
    "langchain-community==0.4.1",
    "langchain-chroma==1.1.0",
    "langchain-huggingface==1.2.2",
    "langchain-text-splitters==1.1.2",
    "chromadb==1.5.9",
    "sentence-transformers==5.4.1",
    "pypdf==6.11.0",
]

[dependency-groups]
dev = [
    "pytest>=8.3.5",
    "ruff>=0.11.0",
]
